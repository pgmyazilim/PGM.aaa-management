spring:
  application:
    name: AAAManagement
  datasource:
    username: sa
    password: Dgmm!Dev*26
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        default_schema: aaa
        format_sql: true
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

aaa:
  datasource:
    dev-url: jdbc:sqlserver://10.99.100.117:1433;databaseName=AAA_DEV;encrypt=false;trustServerCertificate=true
    prod-url: jdbc:sqlserver://10.99.100.117:1433;databaseName=AAA_PROD;encrypt=false;trustServerCertificate=true
  crypto:
    # Base64 kodlu 16/24/32 baytlık AES anahtarı (DatabaseCredentials.PasswordEncrypted için).
    # Üretimde ortam değişkeninden verin; boşsa şifreleme gerektiren işlemler hata verir.
    key: zZ663D/9XL45sF5+xp9pK+qO5xUljKNW+ca1+wo2s/A=
  session-cleanup:
    delay: PT5M

server:
  port: ${SERVER_PORT:10443}
  servlet:
    context-path: /
  ssl:
    # HTTPS için AAA_SSL_ENABLED=true verin ve PEM sertifika/anahtar dosyalarını volume olarak bağlayın
    # (varsayılan yollar: /certs/tls.crt ve /certs/tls.key). Kapalıyken uygulama düz HTTP çalışır.
    enabled: ${AAA_SSL_ENABLED:true}
    certificate: ${AAA_SSL_CERTIFICATE:file:/certs/tls.crt}
    certificate-private-key: ${AAA_SSL_PRIVATE_KEY:file:/certs/tls.key}
    # Özel anahtar parola korumalıysa doldurun
    key-password: ${AAA_SSL_KEY_PASSWORD:}

logging:
  level:
    com.company.aaamanagement: INFO
    org.hibernate.SQL: WARN
