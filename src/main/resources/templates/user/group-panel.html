<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" class="p-5">
    <div class="flex justify-between items-start mb-4">
        <div>
            <p class="font-semibold text-slate-800" th:text="${user.fullName}">Ad Soyad</p>
            <p class="text-xs text-slate-500" th:text="${user.username}">kullanici</p>
        </div>
        <button onclick="closePanel()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Grup Atamaları</p>

    <form th:action="@{/users/{id}/groups/sync(id=${user.userId})}" method="post"
          hx-post="#"
          th:attr="hx-post=@{/users/{id}/groups/sync(id=${user.userId})}"
          hx-target="#group-panel-container"
          hx-swap="innerHTML">
        <div class="space-y-2 mb-4 max-h-96 overflow-y-auto">
            <label th:each="group : ${allGroups}"
                   class="flex items-center gap-3 p-2 rounded hover:bg-slate-50 cursor-pointer">
                <input type="checkbox"
                       name="groupIds"
                       th:value="${group.userGroupId}"
                       th:checked="${memberships.?[userGroup.userGroupId == __${group.userGroupId}__].size() > 0}"
                       class="w-4 h-4 accent-green-500"/>
                <span class="text-sm" th:text="${group.name}">Grup Adı</span>
            </label>
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded text-sm hover:bg-blue-700">
            Kaydet
        </button>
    </form>

    <div th:fragment="successMessage" class="p-5 text-center">
        <div class="text-green-600 font-semibold mb-3">✓ Grup atamaları kaydedildi.</div>
        <button onclick="closePanel()" class="text-sm text-slate-500 hover:text-slate-700">Kapat</button>
    </div>
</div>
</body>
</html>
