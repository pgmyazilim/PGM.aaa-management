<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Duyurular - AAA Yönetim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('announcements')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-xl font-bold text-slate-800">Duyurular</h1>
            <a th:href="@{/announcements/new}"
               class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ Yeni Duyuru</a>
        </div>
        <form method="get" th:action="@{/announcements}" class="mb-4 flex gap-2">
            <input type="text" name="search" th:value="${search}"
                   placeholder="Başlık ara..."
                   class="border border-slate-300 rounded px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-blue-300"/>
            <button type="submit" class="bg-slate-700 text-white px-4 py-2 rounded text-sm hover:bg-slate-800">Ara</button>
            <a th:href="@{/announcements}" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">Temizle</a>
        </form>
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-800 text-white">
                <tr>
                    <th class="px-4 py-3 text-left">Başlık</th>
                    <th class="px-4 py-3 text-center">Önem</th>
                    <th class="px-4 py-3 text-left">Yayın (UTC)</th>
                    <th class="px-4 py-3 text-center">Durum</th>
                    <th class="px-4 py-3 text-left">Oluşturan</th>
                    <th class="px-4 py-3 text-center">İşlem</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a, stat : ${announcements.content}"
                    th:classappend="${stat.odd} ? 'bg-white' : 'bg-slate-50'"
                    class="border-b border-slate-100">
                    <td class="px-4 py-2 font-medium">
                        <span th:if="${a.pinned}" title="Sabitlenmiş">📌</span>
                        <span th:text="${#strings.abbreviate(a.title, 60)}">Başlık</span>
                    </td>
                    <td class="px-4 py-2 text-center">
                        <span class="text-xs px-2 py-0.5 rounded"
                              th:classappend="${a.severity == 'info'} ? 'bg-blue-100 text-blue-700' :
                                              (${a.severity == 'success'} ? 'bg-green-100 text-green-700' :
                                              (${a.severity == 'warning'} ? 'bg-amber-100 text-amber-700' :
                                              (${a.severity == 'critical'} ? 'bg-red-100 text-red-700' : 'bg-slate-200 text-slate-700')))"
                              th:text="${a.severity}">info</span>
                    </td>
                    <td class="px-4 py-2 text-xs text-slate-500">
                        <span th:text="${#temporals.format(@localTimeService.toLocal(a.publishFromUtc), 'dd.MM.yyyy HH:mm')}">—</span>
                        <span th:if="${a.publishUntilUtc != null}"
                              th:text="'→ ' + ${#temporals.format(@localTimeService.toLocal(a.publishUntilUtc), 'dd.MM.yyyy HH:mm')}"></span>
                    </td>
                    <td class="px-4 py-2 text-center">
                        <span th:if="${a.active}" class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded">Aktif</span>
                        <span th:unless="${a.active}" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded">Pasif</span>
                        <span th:if="${a.global}" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded" title="Tüm kullanıcılara görünür">Global</span>
                    </td>
                    <td class="px-4 py-2 text-xs text-slate-500" th:text="${a.createdByUser.username}">—</td>
                    <td class="px-4 py-2 text-center space-x-2">
                        <a th:href="@{/announcements/{id}/edit(id=${a.announcementId})}"
                           class="text-blue-600 hover:underline text-xs">Düzenle</a>
                        <form th:action="@{/announcements/{id}/delete(id=${a.announcementId})}" method="post"
                              class="inline"
                              onsubmit="return confirm('Bu duyuruyu silmek istediğinize emin misiniz?')">
                            <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${announcements.content.empty}">
                    <td colspan="6" class="px-4 py-8 text-center text-slate-400">Duyuru bulunamadı.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${announcements.totalPages > 1}" class="flex gap-1 mt-4 text-sm">
            <a th:if="${!announcements.first}" th:href="@{/announcements(page=${announcements.number - 1}, search=${search})}"
               class="px-3 py-1 border rounded hover:bg-slate-100">«</a>
            <span class="px-3 py-1 text-slate-500"
                  th:text="${announcements.number + 1} + ' / ' + ${announcements.totalPages}">1/1</span>
            <a th:if="${!announcements.last}" th:href="@{/announcements(page=${announcements.number + 1}, search=${search})}"
               class="px-3 py-1 border rounded hover:bg-slate-100">»</a>
        </div>
    </main>
</div>
</body>
</html>
