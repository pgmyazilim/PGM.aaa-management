<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ayar Formu - AAA Yönetim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('settings')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/settings}" class="text-slate-500 hover:text-slate-700 text-sm">← Ayarlar</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${setting.settingId != null} ? 'Ayar Düzenle' : 'Yeni Ayar'">Ayar</h1>
            </div>

            <form th:action="@{/settings/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 space-y-4">
                <input type="hidden" name="settingId" th:value="${setting.settingId}"/>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ayar Anahtarı *</label>
                    <input type="text" name="settingKey" th:value="${setting.settingKey}" required
                           class="w-full border border-slate-300 rounded px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Varsayılan Değer *</label>
                    <textarea name="defaultValue" rows="2" required th:text="${setting.defaultValue}"
                              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
                    <textarea name="description" rows="2" th:text="${setting.description}"
                              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="submit"
                            class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/settings}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>

            <!-- Setting Values (only on edit) -->
            <div th:if="${setting.settingId != null}" class="bg-white rounded-lg shadow p-6">
                <h2 class="font-semibold text-slate-700 mb-4">Özel Değerler</h2>
                <table th:if="${!values.empty}" class="w-full text-sm mb-4">
                    <thead class="bg-slate-100">
                    <tr>
                        <th class="px-3 py-2 text-left">Hedef</th>
                        <th class="px-3 py-2 text-left">Değer</th>
                        <th class="px-3 py-2 text-center">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${values}" class="border-b border-slate-100">
                        <td class="px-3 py-2 text-xs">
                            <span th:if="${v.user != null}" class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded"
                                  th:text="'👤 ' + ${v.user.username}">Kullanıcı</span>
                            <span th:if="${v.userGroup != null}" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded"
                                  th:text="'👥 ' + ${v.userGroup.name}">Grup</span>
                        </td>
                        <td class="px-3 py-2 text-xs font-mono"
                            th:text="${#strings.abbreviate(v.value, 60)}">—</td>
                        <td class="px-3 py-2 text-center">
                            <form th:action="@{/settings/values/{vid}/delete(vid=${v.settingValueId})}"
                                  method="post" class="inline"
                                  onsubmit="return confirm('Silinsin mi?')">
                                <input type="hidden" name="settingId" th:value="${setting.settingId}"/>
                                <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <form th:action="@{/settings/{id}/values/save(id=${setting.settingId})}"
                      method="post" class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kullanıcı</label>
                        <select name="userId"
                                class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                            <option value="">— Seçin —</option>
                            <option th:each="u : ${allUsers}" th:value="${u.userId}" th:text="${u.username}">Kullanıcı</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">VEYA Grup</label>
                        <select name="userGroupId"
                                class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                            <option value="">— Seçin —</option>
                            <option th:each="g : ${allGroups}" th:value="${g.userGroupId}" th:text="${g.name}">Grup</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Değer *</label>
                        <input type="text" name="value" required
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                    </div>
                    <div class="col-span-3">
                        <button type="submit"
                                class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">Değer Ekle</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
