<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Giriş - AAA Yönetim</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="min-h-screen flex items-center justify-center p-6">
    <form th:action="@{/login}" method="post" class="bg-white rounded-lg shadow p-8 w-full max-w-sm space-y-4">
        <h1 class="text-xl font-bold text-slate-800 text-center">AAA Yönetim</h1>
        <p th:if="${param.error}" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2">
            Kullanıcı adı veya şifre hatalı.</p>
        <p th:if="${param.logout}" class="text-sm text-green-700 bg-green-50 border border-green-200 rounded px-3 py-2">
            Çıkış yapıldı.</p>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kullanıcı Adı</label>
            <input type="text" name="username" required autofocus autocomplete="username"
                   class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Şifre</label>
            <input type="password" name="password" required autocomplete="current-password"
                   class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">Giriş Yap</button>
    </form>
</div>
</body>
</html>
