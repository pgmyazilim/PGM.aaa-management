<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gruplar - AAA Yönetim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('groups')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-xl font-bold text-slate-800">Gruplar</h1>
            <a th:href="@{/groups/new}"
               class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ Yeni Grup</a>
        </div>
        <form method="get" th:action="@{/groups}" class="mb-4 flex gap-2">
            <input type="text" name="search" th:value="${search}"
                   placeholder="Grup adı ara..."
                   class="border border-slate-300 rounded px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-blue-300"/>
            <button type="submit" class="bg-slate-700 text-white px-4 py-2 rounded text-sm hover:bg-slate-800">Ara</button>
            <a th:href="@{/groups}" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">Temizle</a>
        </form>
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-800 text-white">
                <tr>
                    <th class="px-4 py-3 text-left">Grup Adı</th>
                    <th class="px-4 py-3 text-left">Açıklama</th>
                    <th class="px-4 py-3 text-center">İşlem</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="group, stat : ${groups.content}"
                    th:classappend="${stat.odd} ? 'bg-white' : 'bg-slate-50'"
                    class="border-b border-slate-100">
                    <td class="px-4 py-2 font-medium" th:text="${group.name}">Grup</td>
                    <td class="px-4 py-2 text-slate-500 text-xs"
                        th:text="${#strings.abbreviate(group.description, 80)} ?: '—'">—</td>
                    <td class="px-4 py-2 text-center space-x-2">
                        <a th:href="@{/groups/{id}/edit(id=${group.userGroupId})}"
                           class="text-blue-600 hover:underline text-xs">Düzenle</a>
                        <a th:href="@{/permissions(groupId=${group.userGroupId})}"
                           class="text-indigo-600 hover:underline text-xs">Yetkiler</a>
                        <form th:action="@{/groups/{id}/delete(id=${group.userGroupId})}" method="post"
                              class="inline"
                              onsubmit="return confirm('Bu grubu silmek istediğinize emin misiniz?')">
                            <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${groups.content.empty}">
                    <td colspan="3" class="px-4 py-8 text-center text-slate-400">Grup bulunamadı.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${groups.totalPages > 1}" class="flex gap-1 mt-4 text-sm">
            <a th:if="${!groups.first}"
               th:href="@{/groups(page=${groups.number - 1}, search=${search})}"
               class="px-3 py-1 border rounded hover:bg-slate-100">«</a>
            <span th:each="i : ${#numbers.sequence(0, groups.totalPages - 1)}">
                <a th:href="@{/groups(page=${i}, search=${search})}"
                   th:text="${i + 1}"
                   th:classappend="${i == groups.number} ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'"
                   class="px-3 py-1 border rounded">1</a>
            </span>
            <a th:if="${!groups.last}"
               th:href="@{/groups(page=${groups.number + 1}, search=${search})}"
               class="px-3 py-1 border rounded hover:bg-slate-100">»</a>
        </div>
    </main>
</div>
</body>
</html>
