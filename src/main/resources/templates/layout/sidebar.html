<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<body>
<nav th:fragment="sidebar(activePage)"
     class="w-56 min-h-screen bg-slate-800 text-slate-300 flex flex-col flex-shrink-0">
    <div class="px-4 py-5 border-b border-slate-700">
        <span class="text-white font-bold text-base">AAA Yönetim</span>
    </div>
    <ul class="flex-1 py-3 text-sm">
        <li>
            <a th:href="@{/users}"
               th:classappend="${activePage == 'users'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>👤</span> Kullanıcılar
            </a>
        </li>
        <li>
            <a th:href="@{/groups}"
               th:classappend="${activePage == 'groups'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>👥</span> Gruplar
            </a>
        </li>
        <li>
            <a th:href="@{/actions}"
               th:classappend="${activePage == 'actions'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>⚡</span> İşlemler
            </a>
        </li>
        <li>
            <a th:href="@{/permissions}"
               th:classappend="${activePage == 'permissions'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>🔐</span> Yetki Matrisi
            </a>
        </li>
        <li>
            <a th:href="@{/constraints}"
               th:classappend="${activePage == 'constraints'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>🔧</span> Kısıtlar
            </a>
        </li>
        <li class="mt-3 mb-1 px-4">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Denetim</span>
        </li>
        <li>
            <a th:href="@{/audit/action-logs}"
               th:classappend="${activePage == 'action-logs'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>📊</span> Aksiyon Logları
            </a>
        </li>
        <li>
            <a th:href="@{/audit/record-audits}"
               th:classappend="${activePage == 'record-audits'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>🗂</span> Kayıt Denetimi
            </a>
        </li>
        <li>
            <a th:href="@{/audit/sessions}"
               th:classappend="${activePage == 'sessions'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>🖥</span> Oturumlar
            </a>
        </li>
        <li>
            <a th:href="@{/audit/tracked-tables}"
               th:classappend="${activePage == 'tracked-tables'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>📋</span> İzlenen Tablolar
            </a>
        </li>
        <li class="mt-3 mb-1 px-4">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Yönetim</span>
        </li>
        <li>
            <a th:href="@{/announcements}"
               th:classappend="${activePage == 'announcements'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>📣</span> Duyurular
            </a>
        </li>
        <li>
            <a th:href="@{/settings}"
               th:classappend="${activePage == 'settings'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>⚙️</span> Ayarlar
            </a>
        </li>
        <li>
            <a th:href="@{/infrastructure/projects}"
               th:classappend="${activePage == 'infrastructure'} ? 'bg-slate-700 text-white' : 'hover:bg-slate-700 hover:text-white'"
               class="flex items-center gap-2 px-4 py-2 transition-colors">
                <span>🏗</span> Altyapı
            </a>
        </li>
    </ul>
    <th:block th:replace="~{layout/select-search :: script}"></th:block>
</nav>
</body>
</html>
