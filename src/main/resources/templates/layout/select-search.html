<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<body>
<!--
  Uygulama genelinde tüm <select> elemanlarını arama kutulu bir dropdown'a dönüştürür.
  Native <select>, form submit ve "required" doğrulaması için DOM'da kalır; sadece
  görünmez hale getirilir (display:none DEĞİL — required validasyonu ve odaklanma
  display:none ile bozulur), üzerine tıklanabilir bir "trigger" ve arama panели bindirilir.
  Her sayfada layout/sidebar.html üzerinden otomatik yüklenir.
-->
<th:block th:fragment="script">
<script>
(function () {
    function normalize(text) {
        return (text || '').toLocaleLowerCase('tr').trim();
    }

    function labelFor(option) {
        return option.textContent.trim();
    }

    function enhanceSelect(select) {
        if (select.dataset.searchEnhanced === 'true' || select.multiple) {
            return;
        }
        select.dataset.searchEnhanced = 'true';

        var wrapper = document.createElement('div');
        wrapper.className = 'relative';
        if (select.classList.contains('w-full')) {
            wrapper.classList.add('w-full');
        }
        select.parentNode.insertBefore(wrapper, select);
        wrapper.appendChild(select);

        select.tabIndex = -1;
        select.classList.add('absolute', 'inset-0', 'w-full', 'h-full', 'opacity-0', 'pointer-events-none');

        var trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.disabled = select.disabled;
        trigger.className = select.className
            .replace(/\babsolute\b|\binset-0\b|\bh-full\b|\bopacity-0\b|\bpointer-events-none\b/g, '')
            .trim() + ' flex items-center justify-between gap-2 bg-white text-left cursor-pointer';
        wrapper.appendChild(trigger);

        var chevron = document.createElement('span');
        chevron.className = 'text-slate-400 text-xs';
        chevron.textContent = '▼';
        trigger.appendChild(chevron);
        var labelSpan = document.createElement('span');
        labelSpan.className = 'truncate';
        trigger.insertBefore(labelSpan, chevron);

        var panel = document.createElement('div');
        panel.className = 'hidden absolute z-50 mt-1 min-w-full w-max max-w-xs bg-white border border-slate-300 rounded shadow-lg';
        var searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.placeholder = 'Ara...';
        searchInput.className = 'w-full border-b border-slate-200 px-3 py-2 text-sm focus:outline-none';
        var list = document.createElement('ul');
        list.className = 'max-h-56 overflow-y-auto text-sm py-1';
        panel.appendChild(searchInput);
        panel.appendChild(list);
        wrapper.appendChild(panel);

        var activeIndex = -1;

        function updateTriggerLabel() {
            var selected = select.options[select.selectedIndex];
            var text = selected ? labelFor(selected) : '';
            labelSpan.textContent = text || ' ';
            labelSpan.classList.toggle('text-slate-400', !selected || selected.value === '');
        }

        function visibleItems() {
            return Array.prototype.slice.call(list.querySelectorAll('li[data-value]'));
        }

        function setActive(index) {
            var items = visibleItems();
            items.forEach(function (el) { el.classList.remove('bg-slate-100'); });
            activeIndex = index < 0 ? -1 : Math.max(0, Math.min(index, items.length - 1));
            if (activeIndex >= 0) {
                items[activeIndex].classList.add('bg-slate-100');
                items[activeIndex].scrollIntoView({ block: 'nearest' });
            }
        }

        function choose(option) {
            select.value = option.value;
            select.dispatchEvent(new Event('change', { bubbles: true }));
            updateTriggerLabel();
            closePanel();
            trigger.focus();
        }

        function buildList(filterText) {
            list.innerHTML = '';
            var query = normalize(filterText);
            Array.prototype.forEach.call(select.options, function (option) {
                var text = labelFor(option);
                if (query && normalize(text).indexOf(query) === -1) {
                    return;
                }
                var item = document.createElement('li');
                item.textContent = text || ' ';
                item.dataset.value = option.value;
                item.setAttribute('role', 'option');
                item.className = 'px-3 py-1.5 cursor-pointer hover:bg-blue-50' +
                    (option.value === select.value ? ' font-medium text-blue-700' : '');
                item.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    choose(option);
                });
                list.appendChild(item);
            });
            if (!list.children.length) {
                var empty = document.createElement('li');
                empty.textContent = 'Sonuç bulunamadı';
                empty.className = 'px-3 py-1.5 text-slate-400';
                list.appendChild(empty);
            }
            setActive(-1);
        }

        function openPanel() {
            if (trigger.disabled) return;
            buildList('');
            panel.classList.remove('hidden');
            trigger.setAttribute('aria-expanded', 'true');
            searchInput.value = '';
            searchInput.focus();
        }

        function closePanel() {
            panel.classList.add('hidden');
            trigger.setAttribute('aria-expanded', 'false');
        }

        function isOpen() {
            return !panel.classList.contains('hidden');
        }

        trigger.setAttribute('role', 'combobox');
        trigger.setAttribute('aria-haspopup', 'listbox');
        trigger.setAttribute('aria-expanded', 'false');
        list.setAttribute('role', 'listbox');

        trigger.addEventListener('click', function () {
            if (isOpen()) {
                closePanel();
            } else {
                openPanel();
            }
        });

        trigger.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openPanel();
            }
        });

        searchInput.addEventListener('input', function () {
            buildList(searchInput.value);
        });

        searchInput.addEventListener('keydown', function (e) {
            var items;
            if (e.key === 'Escape') {
                e.preventDefault();
                closePanel();
                trigger.focus();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                items = visibleItems();
                var target = activeIndex >= 0 ? items[activeIndex] : items[0];
                if (target) {
                    choose(select.options[getOptionIndexByValue(target.dataset.value)]);
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                setActive(activeIndex + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                setActive(activeIndex - 1);
            } else if (e.key === 'Tab') {
                closePanel();
            }
        });

        function getOptionIndexByValue(value) {
            for (var i = 0; i < select.options.length; i++) {
                if (select.options[i].value === value) return i;
            }
            return -1;
        }

        document.addEventListener('click', function (e) {
            if (!wrapper.contains(e.target)) {
                closePanel();
            }
        });

        select.addEventListener('change', updateTriggerLabel);
        updateTriggerLabel();
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('select').forEach(enhanceSelect);
    });
})();
</script>
</th:block>
</body>
</html>
