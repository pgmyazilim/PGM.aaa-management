<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Veritabanı Formu - AAA Yönetim</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('infrastructure')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center gap-3 mb-6">
                <a th:href="@{/infrastructure/databases}" class="text-slate-500 hover:text-slate-700 text-sm">← Veritabanları</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${database.moduleDatabaseId != null} ? 'Veritabanı Düzenle' : 'Yeni Veritabanı'">Veritabanı</h1>
            </div>
            <form th:action="@{/infrastructure/databases/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 grid grid-cols-2 gap-4">
                <input type="hidden" name="moduleDatabaseId" th:value="${database.moduleDatabaseId}"/>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Veritabanı Adı *</label>
                    <input type="text" name="databaseName" th:value="${database.databaseName}" required maxlength="200"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Takma Ad</label>
                    <input type="text" name="databaseAlias" th:value="${database.databaseAlias}" maxlength="100"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Sunucu</label>
                    <select name="databaseServerId"
                            class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                        <option value="">— Yok —</option>
                        <option th:each="srv : ${servers}" th:value="${srv.databaseServerId}"
                                th:text="${srv.serverHostname} ?: ${srv.serverIpAddress}"
                                th:selected="${database.databaseServer != null && database.databaseServer.databaseServerId == srv.databaseServerId}">Sunucu</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kimlik Bilgisi</label>
                    <select name="databaseCredentialId"
                            class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                        <option value="">— Yok —</option>
                        <option th:each="c : ${credentials}" th:value="${c.databaseCredentialId}"
                                th:text="${(c.username ?: '—') + ' @ ' + (c.databaseServer?.serverHostname ?: '—')}"
                                th:selected="${database.databaseCredential != null && database.databaseCredential.databaseCredentialId == c.databaseCredentialId}">Kimlik</option>
                    </select>
                </div>
                <div class="col-span-2 flex gap-3">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/infrastructure/databases}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
