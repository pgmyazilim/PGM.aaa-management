<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>DB Sunucu Formu</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('infrastructure')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/infrastructure/db-servers}" class="text-slate-500 hover:text-slate-700 text-sm">← DB Sunucuları</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${server.databaseServerId != null} ? 'Sunucu Düzenle' : 'Yeni Sunucu'">Sunucu</h1>
            </div>
            <form th:action="@{/infrastructure/db-servers/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 space-y-4">
                <input type="hidden" name="databaseServerId" th:value="${server.databaseServerId}"/>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hostname</label>
                        <input type="text" name="serverHostname" th:value="${server.serverHostname}"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">IP Adresi</label>
                        <input type="text" name="serverIpAddress" th:value="${server.serverIpAddress}"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Port</label>
                        <input type="text" name="serverPort" th:value="${server.serverPort}"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Sürüm</label>
                        <input type="text" name="version" th:value="${server.version}"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>
                </div>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" name="sqlServer8" value="true" th:checked="${server.sqlServer8}"
                           class="w-4 h-4"/> SQL Server 8 Uyumlu
                </label>
                <div class="flex gap-3">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/infrastructure/db-servers}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>

            <!-- Credentials (only on edit) -->
            <div th:if="${server.databaseServerId != null}" class="bg-white rounded-lg shadow p-6">
                <h2 class="font-semibold text-slate-700 mb-4">Kimlik Bilgileri</h2>
                <table th:if="${!credentials.empty}" class="w-full text-sm mb-4">
                    <thead class="bg-slate-100">
                    <tr>
                        <th class="px-3 py-2 text-left">Kullanıcı Adı</th>
                        <th class="px-3 py-2 text-left">Sürüm</th>
                        <th class="px-3 py-2 text-center">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${credentials}" class="border-b border-slate-100">
                        <td class="px-3 py-2 font-mono text-sm" th:text="${c.username} ?: '—'">—</td>
                        <td class="px-3 py-2 text-xs text-slate-500" th:text="${c.version} ?: '—'">—</td>
                        <td class="px-3 py-2 text-center">
                            <form th:action="@{/infrastructure/credentials/{cid}/delete(cid=${c.databaseCredentialId})}"
                                  method="post" class="inline" onsubmit="return confirm('Silinsin mi?')">
                                <input type="hidden" name="serverId" th:value="${server.databaseServerId}"/>
                                <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <form th:action="@{/infrastructure/db-servers/{id}/credentials/save(id=${server.databaseServerId})}"
                      method="post" class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kullanıcı Adı</label>
                        <input type="text" name="username"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Parola</label>
                        <input type="password" name="password"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Sürüm</label>
                        <input type="text" name="version"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                    </div>
                    <div class="col-span-3">
                        <button type="submit"
                                class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">Kimlik Bilgisi Ekle</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
