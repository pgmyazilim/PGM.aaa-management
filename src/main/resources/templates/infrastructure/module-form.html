<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Modül Formu</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('infrastructure')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/infrastructure/modules}" class="text-slate-500 hover:text-slate-700 text-sm">← Modüller</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${module.moduleId != null} ? 'Modül Düzenle' : 'Yeni Modül'">Modül</h1>
            </div>
            <form th:action="@{/infrastructure/modules/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 space-y-4">
                <input type="hidden" name="moduleId" th:value="${module.moduleId}"/>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Proje *</label>
                    <select name="project.projectId" required
                            class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
                        <option value="">— Seçin —</option>
                        <option th:each="p : ${projects}" th:value="${p.projectId}" th:text="${p.name}"
                                th:selected="${module.project != null && module.project.projectId == p.projectId}">Proje</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Modül Adı *</label>
                    <input type="text" name="name" th:value="${module.name}" required
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/infrastructure/modules}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>

            <!-- Module databases (only on edit) -->
            <div th:if="${module.moduleId != null}" class="bg-white rounded-lg shadow p-6">
                <h2 class="font-semibold text-slate-700 mb-4">Veritabanları</h2>
                <table th:if="${!moduleDatabases.empty}" class="w-full text-sm mb-4">
                    <thead class="bg-slate-100">
                    <tr>
                        <th class="px-3 py-2 text-left">Veritabanı</th>
                        <th class="px-3 py-2 text-left">Takma Ad</th>
                        <th class="px-3 py-2 text-left">Sunucu</th>
                        <th class="px-3 py-2 text-left">Kimlik</th>
                        <th class="px-3 py-2 text-center">İşlem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="md : ${moduleDatabases}" class="border-b border-slate-100">
                        <td class="px-3 py-2 font-mono text-sm" th:text="${md.databaseName}">—</td>
                        <td class="px-3 py-2 text-xs text-slate-500" th:text="${md.databaseAlias} ?: '—'">—</td>
                        <td class="px-3 py-2 text-xs text-slate-500" th:text="${md.databaseServer?.serverHostname} ?: '—'">—</td>
                        <td class="px-3 py-2 text-xs text-slate-500" th:text="${md.databaseCredential?.username} ?: '—'">—</td>
                        <td class="px-3 py-2 text-center">
                            <form th:action="@{/infrastructure/module-databases/{mdid}/delete(mdid=${md.moduleDatabaseId})}"
                                  method="post" class="inline" onsubmit="return confirm('Silinsin mi?')">
                                <input type="hidden" name="moduleId" th:value="${module.moduleId}"/>
                                <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <form th:action="@{/infrastructure/modules/{id}/databases/save(id=${module.moduleId})}"
                      method="post" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Veritabanı Adı *</label>
                        <input type="text" name="databaseName" required
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Takma Ad</label>
                        <input type="text" name="databaseAlias"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Sunucu</label>
                        <select name="databaseServerId"
                                class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                            <option value="">— Yok —</option>
                            <option th:each="srv : ${servers}" th:value="${srv.databaseServerId}"
                                    th:text="${srv.serverHostname} ?: ${srv.serverIpAddress}">Sunucu</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kimlik Bilgisi</label>
                        <select name="databaseCredentialId"
                                class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none">
                            <option value="">— Yok —</option>
                            <option th:each="c : ${credentials}" th:value="${c.databaseCredentialId}"
                                    th:text="${(c.username ?: '—') + ' @ ' + (c.databaseServer?.serverHostname ?: '—')}">Kimlik</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <button type="submit"
                                class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">Veritabanı Ekle</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
