<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Projeler - AAA Yönetim</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('infrastructure')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="flex items-center gap-4 mb-5">
            <div class="flex gap-2 text-sm">
                <a th:href="@{/infrastructure/projects}" class="px-3 py-1 bg-slate-800 text-white rounded">Projeler</a>
                <a th:href="@{/infrastructure/modules}" class="px-3 py-1 border rounded hover:bg-slate-100">Modüller</a>
                <a th:href="@{/infrastructure/clients}" class="px-3 py-1 border rounded hover:bg-slate-100">İstemciler</a>
                <a th:href="@{/infrastructure/db-servers}" class="px-3 py-1 border rounded hover:bg-slate-100">DB Sunucuları</a>
            </div>
            <div class="ml-auto">
                <a th:href="@{/infrastructure/projects/new}"
                   class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ Yeni Proje</a>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-800 text-white">
                <tr>
                    <th class="px-4 py-3 text-left">Proje Adı</th>
                    <th class="px-4 py-3 text-left">Son Güncelleme</th>
                    <th class="px-4 py-3 text-center">İşlem</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p, stat : ${projects.content}"
                    th:classappend="${stat.odd} ? 'bg-white' : 'bg-slate-50'"
                    class="border-b border-slate-100">
                    <td class="px-4 py-2 font-medium" th:text="${p.name}">Proje</td>
                    <td class="px-4 py-2 text-xs text-slate-500"
                        th:text="${#temporals.format(p.modifiedAtUtc, 'dd.MM.yyyy HH:mm')}">—</td>
                    <td class="px-4 py-2 text-center space-x-2">
                        <a th:href="@{/infrastructure/projects/{id}/edit(id=${p.projectId})}"
                           class="text-blue-600 hover:underline text-xs">Düzenle</a>
                        <form th:action="@{/infrastructure/projects/{id}/delete(id=${p.projectId})}" method="post"
                              class="inline" onsubmit="return confirm('Silinsin mi?')">
                            <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${projects.content.empty}">
                    <td colspan="3" class="px-4 py-8 text-center text-slate-400">Proje bulunamadı.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
