<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>İstemci Formu</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('infrastructure')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/infrastructure/clients}" class="text-slate-500 hover:text-slate-700 text-sm">← İstemciler</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${client.clientId != null} ? 'İstemci Düzenle' : 'Yeni İstemci'">İstemci</h1>
            </div>
            <form th:action="@{/infrastructure/clients/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 space-y-4">
                <input type="hidden" name="clientId" th:value="${client.clientId}"/>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">İstemci Adı *</label>
                    <input type="text" name="name" th:value="${client.name}" required
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1"
                           th:text="${client.clientId == null} ? 'İstemci Secret' : 'Yeni İstemci Secret'">İstemci Secret</label>
                    <input type="password" name="clientSecret" autocomplete="new-password"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    <p class="text-xs text-slate-400 mt-1"
                       th:text="${client.clientId == null} ? 'Bcrypt ile hash\'lenerek saklanır.' : 'Boş bırakılırsa secret değişmez.'">—</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">İzinli Grant Türleri</label>
                    <input type="text" name="allowedGrantTypes" th:value="${client.allowedGrantTypes}"
                           placeholder="authorization_code,refresh_token"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Access Token Ömrü (sn)</label>
                        <input type="number" name="accessTokenLifetimeSeconds" min="1"
                               th:value="${client.accessTokenLifetimeSeconds}"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Refresh Token Ömrü (sn)</label>
                        <input type="number" name="refreshTokenLifetimeSeconds" min="1"
                               th:value="${client.refreshTokenLifetimeSeconds}"
                               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>
                </div>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" name="active" value="true" th:checked="${client.active}"
                           class="accent-green-500 w-4 h-4"/> Aktif
                </label>
                <div class="flex gap-3">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/infrastructure/clients}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>

            <!-- Redirect URIs (only on edit) -->
            <div th:if="${client.clientId != null}" class="bg-white rounded-lg shadow p-6">
                <h2 class="font-semibold text-slate-700 mb-4">Redirect URI'ler</h2>
                <table th:if="${!redirectUris.empty}" class="w-full text-sm mb-4">
                    <tbody>
                    <tr th:each="u : ${redirectUris}" class="border-b border-slate-100">
                        <td class="px-3 py-2 font-mono text-xs" th:text="${u.redirectUri}">—</td>
                        <td class="px-3 py-2 text-right">
                            <form th:action="@{/infrastructure/redirect-uris/{uid}/delete(uid=${u.clientRedirectUriId})}"
                                  method="post" class="inline" onsubmit="return confirm('Silinsin mi?')">
                                <input type="hidden" name="clientId" th:value="${client.clientId}"/>
                                <button type="submit" class="text-red-500 hover:underline text-xs">Sil</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <p th:if="${redirectUris.empty}" class="text-sm text-slate-400 mb-4">Tanımlı redirect URI yok.</p>
                <form th:action="@{/infrastructure/clients/{id}/redirect-uris/add(id=${client.clientId})}"
                      method="post" class="flex gap-2">
                    <input type="text" name="redirectUri" required placeholder="https://ornek.com/callback"
                           class="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    <button type="submit"
                            class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">Ekle</button>
                </form>
                <p class="text-xs text-slate-400 mt-2">Redirect doğrulaması bu listeye karşı tam eşleşme ile yapılır.</p>
            </div>

            <!-- Module Assignment (only on edit) -->
            <div th:if="${client.clientId != null}" class="bg-white rounded-lg shadow p-6">
                <h2 class="font-semibold text-slate-700 mb-4">Modül Atamaları</h2>
                <form th:action="@{/infrastructure/clients/{id}/modules/sync(id=${client.clientId})}" method="post">
                    <div class="grid grid-cols-2 gap-2 mb-4 max-h-64 overflow-y-auto">
                        <label th:each="m : ${allModules}"
                               class="flex items-center gap-2 p-2 rounded hover:bg-slate-50 cursor-pointer text-sm">
                            <input type="checkbox" name="moduleIds" th:value="${m.moduleId}"
                                   th:checked="${clientModules.?[module.moduleId == __${m.moduleId}__].size() > 0}"
                                   class="accent-blue-500 w-4 h-4"/>
                            <span th:text="${m.name}">Modül</span>
                        </label>
                    </div>
                    <button type="submit"
                            class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700">Modülleri Kaydet</button>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
