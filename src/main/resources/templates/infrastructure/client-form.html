<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>İstemci Formu</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('infrastructure')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/infrastructure/clients}" class="text-slate-500 hover:text-slate-700 text-sm">← İstemciler</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${client.clientId != null} ? 'İstemci Düzenle' : 'Yeni İstemci'">İstemci</h1>
            </div>
            <form th:action="@{/infrastructure/clients/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 space-y-4">
                <input type="hidden" name="clientId" th:value="${client.clientId}"/>
                <div th:if="${client.clientId != null}">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">İstemci Anahtarı (x-client-id)</label>
                    <input type="text" th:value="${client.clientKey}" readonly
                           class="w-full border border-slate-200 bg-slate-50 rounded px-3 py-2 font-mono text-sm select-all"/>
                    <p class="text-xs text-slate-400 mt-1">Veritabanı üretir, değiştirilemez.</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ad *</label>
                    <input type="text" name="name" th:value="${client.name}" required maxlength="100"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
                    <textarea name="description" rows="3"
                              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                              th:text="${client.description}"></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/infrastructure/clients}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
