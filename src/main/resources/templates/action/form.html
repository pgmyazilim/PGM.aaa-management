<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>İşlem Formu - AAA Yönetim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <div th:replace="~{layout/sidebar :: sidebar('actions')}"></div>
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-lg mx-auto">
            <div class="flex items-center gap-3 mb-6">
                <a th:href="@{/actions}" class="text-slate-500 hover:text-slate-700 text-sm">← İşlemler</a>
                <h1 class="text-xl font-bold text-slate-800"
                    th:text="${action.actionId != null} ? 'İşlem Düzenle' : 'Yeni İşlem'">İşlem</h1>
            </div>
            <form th:action="@{/actions/save}" method="post"
                  class="bg-white rounded-lg shadow p-6 space-y-4">
                <input type="hidden" name="actionId" th:value="${action.actionId}"/>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Modül *</label>
                    <select name="module.moduleId" required
                            class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
                        <option value="">— Seçin —</option>
                        <option th:each="m : ${modules}"
                                th:value="${m.moduleId}"
                                th:text="${m.name}"
                                th:selected="${action.module != null && action.module.moduleId == m.moduleId}">Modül</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">İşlem Adı *</label>
                    <input type="text" name="name" th:value="${action.name}" required
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ActionKey *</label>
                    <input type="text" name="actionKey" th:value="${action.actionKey}" required
                           class="w-full border border-slate-300 rounded px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
                    <textarea name="description" rows="2" th:text="${action.description}"
                              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
                </div>
                <div class="flex flex-wrap gap-4">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" name="active" value="true" th:checked="${action.active}"
                               class="accent-green-500 w-4 h-4"/> Aktif
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" name="requiresAuthorization" value="true"
                               th:checked="${action.requiresAuthorization}"
                               class="accent-orange-500 w-4 h-4"/> Yetkilendirme Gerekir
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" name="logOnSuccess" value="true"
                               th:checked="${action.logOnSuccess}"
                               class="accent-blue-500 w-4 h-4"/> Başarı Logla
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" name="logOnFailure" value="true"
                               th:checked="${action.logOnFailure}"
                               class="accent-red-500 w-4 h-4"/> Hata Logla
                    </label>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit"
                            class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">Kaydet</button>
                    <a th:href="@{/actions}" class="px-6 py-2 rounded text-sm border border-slate-300 hover:bg-slate-50">İptal</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
